[package]
name = "resub"
version = "0.1.0"
edition = "2021"
description = "Batch-rename fan-subtitle files and extract embedded ASS/SSA from Matroska"

[lib]
name = "resub"
path = "src/lib.rs"

[[bin]]
name = "resub"
path = "src/main.rs"

[features]
default = ["gui"]
# Native window front-end. Build with --no-default-features for a CLI/browser-only binary.
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "glow",         # OpenGL renderer: far smaller than wgpu and works on old iGPUs
    "default_fonts",
    "system_fonts", # pulls CJK glyphs from the OS, needed for the Chinese UI
    "clipboard",
    "wayland",
    "x11",
] }
flate2 = "1"
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
regex = "1"
walkdir = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
